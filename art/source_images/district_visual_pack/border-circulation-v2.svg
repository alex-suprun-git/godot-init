<text x="70" y="850" font-size="14">Red: import → passport → customs → optional secondary → city. Blue: city → customs → optional secondary → passport → bridge.</text>
<text x="70" y="877" font-size="14">Waiting pockets rejoin upstream of control. Secondary inspection is conditional; it is never a public bypass.</text>
<text x="70" y="904" font-size="13">Open checks: 17 m truck turning envelopes, storage capacity, bus bay, walking-clearance geometry and staffing. No gameplay changes.</text>
