<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" font-family="Helvetica, Arial, sans-serif">
  <title>District layout v2 (schematic)</title>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#cfc8b4"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b9b19a" stroke-width="3"/>
    </pattern>
    <pattern id="rail" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#6f6a62"/>
      <rect x="6" width="4" height="10" fill="#d8d2c4"/>
    </pattern>
  </defs>

  <!-- Ground -->
  <rect width="1600" height="1060" fill="#c9cfa8"/>

  <!-- Neighbor state across the river -->
  <rect x="0" y="0" width="1600" height="70" fill="url(#hatch)"/>
  <text x="24" y="44" font-size="20" fill="#5e5848" letter-spacing="3">NEIGHBOR STATE</text>

  <!-- River and embankment -->
  <rect x="0" y="70" width="1600" height="80" fill="#7f9fb0"/>
  <rect x="0" y="150" width="1600" height="10" fill="#a9a59a"/>
  <text x="24" y="118" font-size="18" fill="#eef2f4" letter-spacing="2">RIVER</text>

  <!-- Bridge and border checkpoint -->
  <rect x="880" y="40" width="40" height="120" fill="#8d8a84"/>
  <rect x="855" y="10" width="90" height="28" fill="#e8e2d4" stroke="#3a3a3a"/>
  <rect x="955" y="6" width="22" height="22" fill="#4a4f47"/>
  <text x="990" y="28" font-size="15" fill="#3a3a3a">Border checkpoint · watchtower</text>

  <!-- Railway along the south edge, with a spur up the east side to the depot -->
  <rect x="0" y="940" width="1600" height="12" fill="url(#rail)"/>
  <rect x="1480" y="200" width="12" height="740" fill="url(#rail)"/>
  <text x="24" y="975" font-size="15" fill="#4b473f">RAILWAY</text>

  <!-- Roads -->
  <g fill="#55575a">
    <rect x="880" y="160" width="40" height="780"/>          <!-- Main street: bridge to station -->
    <rect x="0" y="470" width="1600" height="26"/>           <!-- Cross street through the square -->
    <rect x="120" y="230" width="740" height="18"/>          <!-- North residential street -->
    <rect x="120" y="720" width="760" height="18"/>          <!-- South residential street -->
    <rect x="120" y="230" width="18" height="508"/>          <!-- West street -->
    <rect x="500" y="230" width="18" height="508"/>          <!-- Middle residential street -->
    <rect x="920" y="300" width="560" height="18"/>          <!-- Embankment road to the depot -->
    <rect x="1180" y="496" width="18" height="444"/>         <!-- Old center lane -->
    <rect x="920" y="700" width="560" height="18"/>          <!-- Private-sector lane -->
  </g>

  <!-- ===== West: residential micro-district ===== -->
  <!-- Courtyard blocks (filler five-storeys) -->
  <g fill="#9a9890" stroke="#5f5d57" stroke-width="2">
    <rect x="170" y="270" width="140" height="34"/>
    <rect x="330" y="270" width="140" height="34"/>
    <rect x="170" y="400" width="34" height="56"/>
    <rect x="550" y="270" width="140" height="34"/>
    <rect x="710" y="270" width="130" height="34"/>
    <rect x="550" y="400" width="140" height="34"/>
    <rect x="170" y="530" width="140" height="34"/>
    <rect x="550" y="530" width="140" height="34"/>
    <rect x="710" y="530" width="130" height="34"/>
    <rect x="170" y="650" width="140" height="34"/>
    <rect x="550" y="650" width="140" height="34"/>
    <rect x="710" y="650" width="130" height="34"/>
  </g>
  <!-- Courtyards -->
  <g fill="#b7c08f">
    <rect x="215" y="320" width="250" height="70"/>
    <rect x="565" y="320" width="270" height="70"/>
    <rect x="215" y="580" width="250" height="60"/>
    <rect x="565" y="580" width="270" height="60"/>
  </g>
  <!-- School and kindergarten -->
  <rect x="740" y="390" width="100" height="60" fill="#d9c48f" stroke="#5f5d57" stroke-width="2"/>
  <text x="752" y="425" font-size="14" fill="#3a3a3a">School</text>
  <rect x="380" y="530" width="90" height="40" fill="#d9c48f" stroke="#5f5d57" stroke-width="2"/>
  <text x="386" y="556" font-size="13" fill="#3a3a3a">Kindergarten</text>
  <!-- Garages -->
  <g fill="#8a8073" stroke="#5f5d57">
    <rect x="170" y="760" width="22" height="30"/><rect x="194" y="760" width="22" height="30"/><rect x="218" y="760" width="22" height="30"/>
    <rect x="242" y="760" width="22" height="30"/><rect x="266" y="760" width="22" height="30"/><rect x="290" y="760" width="22" height="30"/>
    <rect x="314" y="760" width="22" height="30"/><rect x="338" y="760" width="22" height="30"/>
  </g>
  <text x="172" y="810" font-size="14" fill="#3a3a3a">Garages</text>

  <!-- Key: Block 5 -->
  <rect x="330" y="400" width="140" height="40" fill="#c4533a" stroke="#2b2b2b" stroke-width="3"/>
  <text x="345" y="426" font-size="17" font-weight="bold" fill="#fff">BLOCK 5</text>

  <!-- Key: Boiler House No. 3 at the west edge, with coal yard -->
  <rect x="20" y="380" width="80" height="70" fill="#c4533a" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="86" cy="394" r="10" fill="#7a3324" stroke="#2b2b2b" stroke-width="2"/>
  <ellipse cx="45" cy="475" rx="26" ry="12" fill="#2a2a2a"/>
  <text x="20" y="360" font-size="15" font-weight="bold" fill="#2b2b2b">BOILER No. 3</text>
  <text x="20" y="505" font-size="12" fill="#3a3a3a">coal yard</text>

  <!-- Overground heat pipes from the boiler house to the blocks -->
  <g fill="none" stroke="#c9a24a" stroke-width="4" stroke-dasharray="14 6">
    <path d="M100 415 H155 V315 H860"/>
    <path d="M155 415 V595 H860"/>
  </g>
  <text x="225" y="345" font-size="12" fill="#7a5a18">heat pipes, above ground</text>

  <!-- ===== Center: square and administration ===== -->
  <rect x="940" y="370" width="200" height="90" fill="#bdb6a2"/>
  <circle cx="1040" cy="415" r="10" fill="#5b5b5b"/>
  <text x="1056" y="420" font-size="12" fill="#3a3a3a">monument</text>
  <rect x="975" y="324" width="130" height="44" fill="#c4533a" stroke="#2b2b2b" stroke-width="3"/>
  <text x="988" y="351" font-size="13" font-weight="bold" fill="#fff">ADMINISTRATION</text>
  <text x="1150" y="400" font-size="12" fill="#3a3a3a">square · your desk faces it</text>

  <!-- ===== East: old center ===== -->
  <rect x="1230" y="520" width="60" height="70" fill="#c4533a" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="1260" cy="555" r="14" fill="#3f7a5f" stroke="#2b2b2b" stroke-width="2"/>
  <text x="1300" y="560" font-size="15" font-weight="bold" fill="#2b2b2b">CHURCH</text>
  <g fill="#d6b98a" stroke="#5f5d57" stroke-width="2">
    <rect x="960" y="520" width="80" height="44"/>
    <rect x="1060" y="520" width="90" height="44"/>
    <rect x="960" y="590" width="190" height="44"/>
    <rect x="1220" y="610" width="110" height="40"/>
  </g>
  <text x="962" y="660" font-size="13" fill="#3a3a3a">Old center · merchant houses</text>

  <!-- ===== North-east: port and fuel depot on the embankment ===== -->
  <rect x="1300" y="160" width="160" height="20" fill="#8d8a84"/>
  <text x="1306" y="196" font-size="12" fill="#3a3a3a">pier</text>
  <g fill="#c4533a" stroke="#2b2b2b" stroke-width="3">
    <circle cx="1240" cy="245" r="24"/>
    <circle cx="1300" cy="245" r="24"/>
    <circle cx="1360" cy="245" r="24"/>
  </g>
  <text x="1210" y="210" font-size="15" font-weight="bold" fill="#2b2b2b">FUEL DEPOT</text>
  <rect x="1180" y="330" width="120" height="44" fill="#a65b42" stroke="#5f5d57" stroke-width="2"/>
  <text x="1190" y="357" font-size="12" fill="#fff">warehouses</text>

  <!-- ===== South-east: private sector (filler) ===== -->
  <g fill="#b9a68a" stroke="#6a5f50">
    <rect x="1230" y="740" width="30" height="26"/><rect x="1280" y="740" width="30" height="26"/><rect x="1330" y="740" width="30" height="26"/><rect x="1380" y="740" width="30" height="26"/>
    <rect x="1230" y="800" width="30" height="26"/><rect x="1280" y="800" width="30" height="26"/><rect x="1330" y="800" width="30" height="26"/><rect x="1380" y="800" width="30" height="26"/>
    <rect x="1230" y="860" width="30" height="26"/><rect x="1280" y="860" width="30" height="26"/><rect x="1330" y="860" width="30" height="26"/>
  </g>
  <text x="1232" y="910" font-size="13" fill="#3a3a3a">Private houses</text>

  <!-- ===== South: station, market, wasteland ===== -->
  <rect x="840" y="885" width="120" height="45" fill="#d9cdb0" stroke="#2b2b2b" stroke-width="2"/>
  <text x="866" y="913" font-size="14" fill="#2b2b2b">STATION</text>
  <g stroke="#2b2b2b" stroke-dasharray="6 4" stroke-width="2" fill="none">
    <rect x="560" y="790" width="260" height="130"/>
  </g>
  <g>
    <rect x="580" y="805" width="30" height="22" fill="#4f6fa0"/><rect x="620" y="805" width="30" height="22" fill="#b4483a"/><rect x="660" y="805" width="30" height="22" fill="#5f8a63"/><rect x="700" y="805" width="30" height="22" fill="#e6dfcc"/><rect x="740" y="805" width="30" height="22" fill="#4f6fa0"/>
    <rect x="580" y="845" width="30" height="22" fill="#e6dfcc"/><rect x="620" y="845" width="30" height="22" fill="#5f8a63"/><rect x="660" y="845" width="30" height="22" fill="#4f6fa0"/><rect x="700" y="845" width="30" height="22" fill="#b4483a"/><rect x="740" y="845" width="30" height="22" fill="#5f8a63"/>
  </g>
  <text x="566" y="890" font-size="14" font-weight="bold" fill="#2b2b2b">STATION MARKET</text>
  <text x="566" y="908" font-size="12" fill="#3a3a3a">out of reach until district head</text>

  <rect x="150" y="840" width="300" height="90" fill="#d1c79c" stroke="#8a8264" stroke-dasharray="6 4"/>
  <g fill="#6f8f4a">
    <circle cx="190" cy="870" r="10"/><circle cx="230" cy="895" r="9"/><circle cx="270" cy="868" r="10"/><circle cx="320" cy="900" r="9"/><circle cx="380" cy="875" r="10"/><circle cx="410" cy="905" r="8"/>
  </g>
  <text x="160" y="858" font-size="14" font-weight="bold" fill="#2b2b2b">WASTELAND · birch grove</text>
  <text x="160" y="924" font-size="12" fill="#3a3a3a">future housing block</text>

  <!-- Default camera view at start (scroll and zoom move it) -->
  <rect x="160" y="200" width="1000" height="560" fill="none" stroke="#1e2320" stroke-width="3" stroke-dasharray="16 10"/>
  <text x="168" y="194" font-size="14" fill="#1e2320">Screen at default zoom · drag or WASD to scroll, wheel to zoom</text>

  <!-- Legend -->
  <g transform="translate(1180, 960)">
    <rect width="400" height="90" fill="#f4f0e6" stroke="#2b2b2b"/>
    <rect x="14" y="14" width="20" height="14" fill="#c4533a" stroke="#2b2b2b"/>
    <text x="42" y="26" font-size="13" fill="#2b2b2b">Key location (requests happen here)</text>
    <rect x="14" y="38" width="20" height="14" fill="#9a9890" stroke="#5f5d57"/>
    <text x="42" y="50" font-size="13" fill="#2b2b2b">Ordinary city (generated filler)</text>
    <line x1="14" y1="70" x2="34" y2="70" stroke="#c9a24a" stroke-width="4" stroke-dasharray="7 3"/>
    <text x="42" y="74" font-size="13" fill="#2b2b2b">Heat pipes · dashed outline: locked area</text>
  </g>
</svg>
