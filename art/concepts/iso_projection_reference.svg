<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1320" width="1320" height="1320">
<rect width="1320" height="1320" fill="#f4f0e6"/>
<text x="40.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#2b2b2b" text-anchor="start">True isometric reference for map sprites</text>
<text x="40.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#4a4a4a" text-anchor="start">Orthographic. Ground axes run at exactly 30 degrees to the horizontal edge of the picture (a ground line changes 0.577 px per 1 px of width).</text>
<text x="40.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2b2b2b" text-anchor="start">Rules</text>
<text x="40.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">1. The long side of every vehicle, wagon row, garage row, fence and station runs along the red axis (rising to the right).</text>
<text x="40.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">    The game mirrors the picture when a street runs the other way.</text>
<text x="40.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">2. The footprint is a clean rectangle in this projection. Its near corner (the bottom of the picture) touches the bottom</text>
<text x="40.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">    edge, with a margin of at most 3% of the height.</text>
<text x="40.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">3. Vertical edges stay exactly vertical. No perspective: far parts are not smaller.</text>
<text x="40.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">4. The long side facing the viewer is the one on the lower right; the short end faces the lower left.</text>
<text x="40.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#333" text-anchor="start">5. The red slope (0.577) is the target. Flatter than 0.52 or steeper than 0.63 is rejected.</text>
